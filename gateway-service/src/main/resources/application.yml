server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: auth-usuarios
          uri: lb://auth-service
          predicates:
            - Path=/api/usuarios/**
        - id: auth-permissoes
          uri: lb://auth-service
          predicates:
            - Path=/api/permissoes/**
        - id: rh-service
          uri: lb://rh-service
          predicates:
            - Path=/api/rh/**
        - id: dashboard-service
          uri: lb://dashboard-service
          predicates:
            - Path=/api/dashboard/**, /api/tasks/**
        - id: estoque-service
          uri: lb://estoque-service
          predicates:
            - Path=/api/estoque/**
        - id: vendas-service
          uri: lb://vendas-service
          predicates:
            - Path=/api/vendas/**
        - id: financeiro-service
          uri: lb://financeiro-service
          predicates:
            - Path=/api/financeiro/**
        - id: producao-service
          uri: lb://producao-service
          predicates:
            - Path=/api/producao/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notification/**, /api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO