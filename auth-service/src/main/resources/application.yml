server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fablab_auth}
    username: ${DB_USERNAME:fablab}
    password: ${DB_PASSWORD:fablab}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:fablab}
    password: ${RABBITMQ_PASSWORD:fablab}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# Configuração do token JWT.
jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
  issuer: ${JWT_ISSUER:fablab}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.fablab.auth: INFO