server:
  port: ${PORT:8087}

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fablab_notification}
    username: ${DB_USERNAME:fablab}
    password: ${DB_PASSWORD:fablab}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:fablab}
    password: ${RABBITMQ_PASSWORD:fablab}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

jwt:
  secret: ${JWT_SECRET:}
  issuer: ${JWT_ISSUER:fablab}

notification:
  email:
    remetente: ${NOTIFICATION_EMAIL_FROM:no-reply@fablab.local}
    destino-padrao: ${NOTIFICATION_EMAIL_TO:admin@fablab.local}
  historico:
    retencao-dias: ${NOTIFICATION_HISTORICO_RETENCAO_DIAS:90}
  expurgo:
    scheduler:
      enabled: ${NOTIFICATION_EXPURGO_SCHEDULER_ENABLED:true}
      cron: ${NOTIFICATION_EXPURGO_SCHEDULER_CRON:0 0 3 * * *}
  reenvio:
    scheduler:
      enabled: ${NOTIFICATION_REENVIO_SCHEDULER_ENABLED:false}
      cron: ${NOTIFICATION_REENVIO_SCHEDULER_CRON:0 */30 * * * *}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.fablab.notification: INFO
