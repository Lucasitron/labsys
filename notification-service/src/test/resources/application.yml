spring:
  datasource:
    url: jdbc:h2:mem:fablabnotification;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  mail:
    host: localhost
    port: 3025

eureka:
  client:
    enabled: false

jwt:
  secret: fablab-notification-test-secret-key-min-32-bytes-123456
  issuer: fablab-test

notification:
  email:
    remetente: no-reply@fablab.test
    destino-padrao: admin@fablab.test
  historico:
    retencao-dias: 90
  expurgo:
    scheduler:
      enabled: false
  reenvio:
    scheduler:
      enabled: false

management:
  health:
    mail:
      enabled: false

logging:
  level:
    com.fablab.notification: WARN
