# Nginx — proxy reverso do FabLab.
# Termina TLS (certificados Tailscale ou Let's Encrypt) e encaminha para o Gateway (8080).
# Em desenvolvimento: `http://localhost:80` -> `http://gateway:8080`.

upstream fablab_gateway {
    server gateway:8080;
}

server {
    listen 80;
    server_name _;

    # Produção: redireciona HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fablab.local;

    # Configurar certificados reais em produção (Tailscale/Certbot).
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://fablab_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket (SvelteKit HMR/touchpoints)
    location /ws {
        proxy_pass http://fablab_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}