# Overlay de desenvolvimento — monólito Laravel (build local).
# Uso:
#   APP_KEY=... JWT_SECRET=... POSTGRES_PASSWORD=... \
#     docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up -d --build
# Segredos via ambiente ou `infra/.env` (ver `infra/.env.example`).
# NADA de segredo codificado aqui: só referências ${VAR}.
# Scheduler = serviço `scheduler` dedicado (loop `schedule:run` a cada 60s),
# não cron no host: sobe junto no `up`, mesma imagem, logs em `docker logs`.

x-app-env: &app-env
  APP_NAME: FabLab
  APP_ENV: local
  APP_DEBUG: "${APP_DEBUG:-true}"
  APP_URL: "${APP_URL:-http://localhost:8080}"
  APP_KEY: "${APP_KEY:?APP_KEY é obrigatório — gerar com `php artisan key:generate --show`}"
  LOG_LEVEL: "${LOG_LEVEL:-debug}"
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: "${POSTGRES_DB:-fablab}"
  DB_USERNAME: "${POSTGRES_USER:-fablab}"
  DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatório (ver infra/.env.example)}"
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  JWT_SECRET: "${JWT_SECRET:?JWT_SECRET é obrigatório — gerar com `php artisan jwt:secret --show`}"
  JWT_TTL: "${JWT_TTL:-15}"
  JWT_REFRESH_TTL: "${JWT_REFRESH_TTL:-10080}"
  # Seed do admin raiz — dev-only (admin@fablab.org / admin123).
  AUTH_SEED_ENABLED: "${AUTH_SEED_ENABLED:-true}"
  AUTH_SEED_EMAIL: "${AUTH_SEED_EMAIL:-admin@fablab.org}"
  AUTH_SEED_USERNAME: "${AUTH_SEED_USERNAME:-admin}"
  AUTH_SEED_PASSWORD: "${AUTH_SEED_PASSWORD:-admin123}"

services:
  postgres:
    ports:
      - "5432:5432" # dev-only: acesso local (psql). Prod NÃO publica 5432.

  app:
    build:
      context: ../backend
    container_name: fablab-app-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - fablab-net

  worker:
    build:
      context: ../backend
    container_name: fablab-worker-dev
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - fablab-net

  scheduler:
    build:
      context: ../backend
    container_name: fablab-scheduler-dev
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction || true; sleep 60; done"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - fablab-net
