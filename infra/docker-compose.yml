name: fablab-infra

networks:
  fablab-net:
    driver: bridge

volumes:
  postgres-data:

# Infraestrutura base do FabLab — MONÓLITO modular Laravel.
# Um único app (`app`, porta 8080) + UM Postgres (`fablab`, schemas por módulo
# via migrations) + fila `database` (SEM broker: sem RabbitMQ/Redis).
# Uso (segredos via ambiente ou `infra/.env`, ver `infra/.env.example`):
#   dev:     docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up -d --build
#   testing: docker compose -f infra/docker-compose.yml -f infra/docker-compose.testing.yml up -d --build
#   prod:    TAG=<versão> docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: fablab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fablab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatório (ver infra/.env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-fablab}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fablab} -d ${POSTGRES_DB:-fablab}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - fablab-net
