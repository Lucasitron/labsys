# Overlay de homologação (ambiente de QA/Testes).
# Uso:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.testing.yml up --build
# Imagens instanciadas localmente e marcadas com a TAG informada.
services:
  discovery:
    build:
      context: ../discovery-service
    image: ghcr.io/fablab/discovery-service:${TAG:-testing}
    container_name: fablab-discovery-testing
    ports:
      - "8761:8761"
    networks:
      - fablab-net

  gateway:
    build:
      context: ../gateway-service
    image: ghcr.io/fablab/gateway-service:${TAG:-testing}
    container_name: fablab-gateway-testing
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://discovery:8761/eureka
      SPRING_PROFILES_ACTIVE: testing
    depends_on:
      - discovery
    networks:
      - fablab-net

  auth:
    build:
      context: ../auth-service
    image: ghcr.io/fablab/auth-service:${TAG:-testing}
    container_name: fablab-auth-testing
    ports:
      - "8081:8081"
    environment:
      EUREKA_URI: http://discovery:8761/eureka
      DB_URL: jdbc:postgresql://postgres:5432/fablab_auth
      DB_USERNAME: ${POSTGRES_USER:-fablab}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fablab}
      RABBITMQ_HOST: rabbitmq
      SPRING_PROFILES_ACTIVE: testing
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fablab-net

  rh:
