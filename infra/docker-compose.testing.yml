# Overlay de homologação (QA/Testes) — monólito Laravel.
# Uso:
#   APP_KEY=... JWT_SECRET=... POSTGRES_PASSWORD=... \
#     docker compose -f infra/docker-compose.yml -f infra/docker-compose.testing.yml up -d --build
# Imagem local marcada com a TAG informada (`TAG` default: `testing`).
# Segredos via ambiente ou `infra/.env` — nada codificado aqui.

x-app-env: &app-env
  APP_NAME: FabLab
  APP_ENV: testing
  APP_DEBUG: "${APP_DEBUG:-false}"
  APP_URL: "${APP_URL:-http://localhost:8080}"
  APP_KEY: "${APP_KEY:?APP_KEY é obrigatório — gerar com `php artisan key:generate --show`}"
  LOG_LEVEL: "${LOG_LEVEL:-debug}"
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: "${POSTGRES_DB:-fablab}"
  DB_USERNAME: "${POSTGRES_USER:-fablab}"
  DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatório (ver infra/.env.example)}"
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  JWT_SECRET: "${JWT_SECRET:?JWT_SECRET é obrigatório — gerar com `php artisan jwt:secret --show`}"
  JWT_TTL: "${JWT_TTL:-15}"
  JWT_REFRESH_TTL: "${JWT_REFRESH_TTL:-10080}"
  # Seed desligado por padrão em testing (ligar só p/ teste de login).
  AUTH_SEED_ENABLED: "${AUTH_SEED_ENABLED:-false}"
  AUTH_SEED_EMAIL: "${AUTH_SEED_EMAIL:-admin@fablab.org}"
  AUTH_SEED_USERNAME: "${AUTH_SEED_USERNAME:-admin}"
  AUTH_SEED_PASSWORD: "${AUTH_SEED_PASSWORD:-admin123}"

services:
  postgres:
    ports:
      - "5432:5432" # testing/QA local. Prod NÃO publica 5432.

  app:
    build:
      context: ../backend
    image: ghcr.io/fablab/backend:${TAG:-testing}
    container_name: fablab-app-testing
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - fablab-net

  worker:
    image: ghcr.io/fablab/backend:${TAG:-testing}
    container_name: fablab-worker-testing
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - fablab-net

  scheduler:
    image: ghcr.io/fablab/backend:${TAG:-testing}
    container_name: fablab-scheduler-testing
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction || true; sleep 60; done"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - fablab-net
