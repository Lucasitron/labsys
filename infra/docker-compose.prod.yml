# Overlay de produção. Uso:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
# As imagens DEVEM ser publicadas previamente (build + push no CI) e referenciadas
# por TAG. Nenhuma credencial deve ser codificada aqui: use arquivo `.env` ou
# cofre de segredos do orquestrador.
services:
  discovery:
    image: ghcr.io/fablab/discovery-service:${TAG}
    container_name: fablab-discovery-prod
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - fablab-net

  gateway:
    image: ghcr.io/fablab/gateway-service:${TAG}
    container_name: fablab-gateway-prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://discovery:8761/eureka
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - discovery
    networks:
      - fablab-net

  auth:
    image: ghcr.io/fablab/auth-service:${TAG}
    container_name: fablab-auth-prod
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      EUREKA_URI: http://discovery:8761/eureka
      DB_URL: jdbc:postgresql://postgres:5432/fablab_auth
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fablab-net

  rh:
    image: ghcr.io/fablab/rh-service:${TAG}
