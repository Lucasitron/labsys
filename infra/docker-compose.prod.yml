# Overlay de produção — monólito Laravel.
# Uso:
#   TAG=<versão-publicada> APP_KEY=... JWT_SECRET=... POSTGRES_USER=... POSTGRES_PASSWORD=... \
#     docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml pull && \
#   TAG=<versão-publicada> ... up -d
# REGRAS DURAS:
# - `TAG` é OBRIGATÓRIA (sem default): sem TAG o `config`/`up` falha de propósito.
# - Sem `build`: só imagem publicada `ghcr.io/fablab/backend:${TAG}`.
# - Postgres SEM `ports:` (5432 acessível só dentro da rede `fablab-net).
# - `APP_DEBUG=false` fixo; seed do admin raiz DESLIGADO (nunca `true` em prod real).
# Segredos via ambiente ou `infra/.env` (chmod 600) — nada codificado aqui.

x-app-env: &app-env
  APP_NAME: FabLab
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: "${APP_URL:?APP_URL é obrigatório em prod (ex.: https://fablab.exemplo.br)}"
  APP_KEY: "${APP_KEY:?APP_KEY é obrigatório — gerar com `php artisan key:generate --show`}"
  LOG_LEVEL: "${LOG_LEVEL:-warning}"
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: "${POSTGRES_DB:-fablab}"
  DB_USERNAME: "${POSTGRES_USER:?POSTGRES_USER é obrigatório em prod}"
  DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatório (ver infra/.env.example)}"
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  JWT_SECRET: "${JWT_SECRET:?JWT_SECRET é obrigatório — gerar com `php artisan jwt:secret --show`}"
  JWT_TTL: "${JWT_TTL:-15}"
  JWT_REFRESH_TTL: "${JWT_REFRESH_TTL:-10080}"
  # NUNCA `true` em produção real (seed dev-only: admin@fablab.org/admin123).
  AUTH_SEED_ENABLED: "${AUTH_SEED_ENABLED:-false}"

services:
  app:
    image: "ghcr.io/fablab/backend:${TAG:?TAG é obrigatória em prod (ex.: TAG=1.2.3)}"
    container_name: fablab-app-prod
    restart: unless-stopped
    ports:
      - "8080:8080" # exposto p/ o proxy reverso/Tailscale do host (80/443 terminam fora).
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - fablab-net

  worker:
    image: "ghcr.io/fablab/backend:${TAG:?TAG é obrigatória em prod (ex.: TAG=1.2.3)}"
    container_name: fablab-worker-prod
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - fablab-net

  scheduler:
    image: "ghcr.io/fablab/backend:${TAG:?TAG é obrigatória em prod (ex.: TAG=1.2.3)}"
    container_name: fablab-scheduler-prod
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction || true; sleep 60; done"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - fablab-net
