spring:
  datasource:
    url: jdbc:h2:mem:fablabfinanceiro;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

eureka:
  client:
    enabled: false

jwt:
  secret: fablab-financeiro-test-secret-key-min-32-bytes-1234567890
  issuer: fablab-test

financeiro:
  vencidos:
    scheduler:
      enabled: false
      cron: 0 0 8 * * *

logging:
  level:
    com.fablab.financeiro: WARN
