server:
  port: ${PORT:8084}

spring:
  application:
    name: vendas-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fablab_vendas}
    username: ${DB_USERNAME:fablab}
    password: ${DB_PASSWORD:fablab}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:fablab}
    password: ${RABBITMQ_PASSWORD:fablab}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:trocar-em-producao-com-no-minimo-32-caracteres-123456}
  issuer: ${JWT_ISSUER:fablab}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.fablab.vendas: INFO